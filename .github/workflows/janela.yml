name: janela

on:
  workflow_dispatch:
    inputs:
      passos:
        description: "passos de treino (igual pras duas janelas)"
        default: "100000"

permissions:
  contents: read

jobs:
  janela:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        janela: [2, 3, 4, 6, 8, 10]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instala dependências
        run: pip install numpy pyarrow
      - name: Prepara Wikipédia pt
        run: python3 -I grande/prepara.py dados_grande
      - name: Treina janela ${{ matrix.janela }}
        env:
          DADOS: dados_grande
          JANELA: ${{ matrix.janela }}
          PASSOS: ${{ inputs.passos }}
        run: python3 -I -u grande/janela.py
