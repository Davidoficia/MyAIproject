name: junta

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  junta:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Pega pesos do Nx (branch nx-grande)
        uses: actions/checkout@v4
        with:
          ref: nx-grande
          path: nxg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instala dependências
        run: pip install numpy pyarrow

      - name: Prepara Wikipédia pt
        run: python3 -I grande/prepara.py dados_grande

      - name: Junta NM + SM + Nx
        env:
          DADOS: dados_grande
          PESOS_DIR: nxg/pesos
          NTE: "1500"
          NM_FRASES: "2000000"
          SM_FRASES: "2000000"
          SM_PASSOS: "3000"
          NX_PASSES: "4"
        run: python3 -I -u grande/junta.py
