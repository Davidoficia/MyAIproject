name: nm-grande

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dupla:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: nx-grande
          path: pesos_branch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instala dependências
        run: pip install numpy pyarrow

      - name: Prepara Wikipédia pt (mesmo corpus do treino grande)
        run: python3 -I grande/prepara.py dados_grande

      - name: NM + Nx no corpus grande
        env:
          DADOS: dados_grande
          PESOS_DIR: pesos_branch/pesos
          NM_FRASES: "2000000"
          NTE: "1500"
        run: python3 -I -u grande/nm_grande.py
