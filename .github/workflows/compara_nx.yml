name: compara-nx

# Compara três checkpoints do Nx no MESMO conjunto de teste do CI (split por artigo):
#   R1 = primeira rodada (477 mil passos, commit 1443463 da branch escala-ck)
#   R2 = 1,43 milhão de passos (commit 6c9d483, branch pesos-r2)
#   R3 = atual, 2,5 milhões de passos (commit 09c8592, branch escala-ck)
# Usa escala/diagnosticos.py. Sem -I: o script importa nx_variantes da própria pasta.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compara:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instala dependências
        run: pip install pyarrow numpy
      - name: Pega os três checkpoints
        run: |
          git fetch origin pesos-r1 pesos-r2 escala-ck
          mkdir -p pesos_r1 pesos_r2 pesos_r3
          git show 1443463:pesos/ckpt_base.npz > pesos_r1/ckpt_base.npz
          git show 1443463:pesos/itos.json > pesos_r1/itos.json
          git show 6c9d483:pesos/ckpt_base.npz > pesos_r2/ckpt_base.npz
          git show 6c9d483:pesos/itos.json > pesos_r2/itos.json
          git show 09c8592:pesos/ckpt_base.npz > pesos_r3/ckpt_base.npz
          git show 09c8592:pesos/itos.json > pesos_r3/itos.json
          ls -la pesos_r1 pesos_r2 pesos_r3
      - name: Prepara Wikipédia pt (mesmo do treino)
        run: python3 -I grande/prepara.py dados_escala
      - name: Acrescenta livros PD (mesmo do treino)
        env:
          MAX_LIVROS_PALAVRAS: "150000000"
        run: python3 -I escala/prepara_livros.py dados_escala
      - name: Mede R1 e R2 no mesmo teste
        working-directory: escala
        run: |
          python3 -u diagnosticos.py ${{ github.workspace }}/pesos_r1 ${{ github.workspace }}/dados_escala/teste.txt ${{ github.workspace }}/diag_r1.json
          python3 -u diagnosticos.py ${{ github.workspace }}/pesos_r2 ${{ github.workspace }}/dados_escala/teste.txt ${{ github.workspace }}/diag_r2.json
          python3 -u diagnosticos.py ${{ github.workspace }}/pesos_r3 ${{ github.workspace }}/dados_escala/teste.txt ${{ github.workspace }}/diag_r3.json
      - uses: actions/upload-artifact@v4
        with:
          name: compara-nx-${{ github.run_id }}
          path: |
            diag_r1.json
            diag_r2.json
            diag_r3.json
          retention-days: 30
